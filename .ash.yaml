# ASH (Automated Security Helper) configuration
# Docs: https://awslabs.github.io/automated-security-helper/docs/
#
# All suppressions below have been reviewed and documented. They are limited
# to scanner false positives and transitive npm CVEs that `npm audit`
# (the authoritative npm ecosystem scanner) reports as clean.

global_settings:
    suppressions:
        # ── False positive: SigV4 empty-body SHA256 constant ──────────────
        - rule_id: SECRET-HEX-HIGH-ENTROPY-STRING
          path: lib/stacks/frontend/app/src/services/monitor-service.ts
          line_start: 100
          line_end: 100
          reason: >
              Not a secret. This is the well-known SHA-256 hash of an empty body
              (e3b0c442...7852b855) required by AWS Signature V4 signing when the
              request body is empty. It is a public constant documented in the AWS
              SigV4 specification.

        # ── Transitive npm dependency CVEs (dev/build-time only) ──────────
        # These packages are not imported directly by application code. They are
        # pulled in transitively by eslint, aws-cdk-lib, etc. and are only
        # used at build/lint time, never at runtime in deployed Lambdas,
        # Lambda layers, or the AgentCore container image.
        #
        # `npm audit` (the authoritative npm ecosystem scanner) reports zero
        # vulnerabilities. These entries document the grype findings with the
        # same reasoning.

        - rule_id: GHSA-rf6f-7fwh-wjgh-flatted
          path: package-lock.json
          reason: >
              flatted 3.3.3 transitive (via eslint toolchain). Build-time only, not
              in runtime bundles. npm audit reports clean.

        - rule_id: GHSA-25h7-pfq9-p65f-flatted
          path: package-lock.json
          reason: >
